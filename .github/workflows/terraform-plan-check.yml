name: Terraform plan check

# A reusable workflow so an infrastructure repo can gate its pull requests on
# CloudChain without vendoring any of this. Call it with:
#
#   jobs:
#     cloudchain:
#       uses: threetheodrummer/CloudChain/.github/workflows/terraform-plan-check.yml@main
#       with:
#         plan-file: plan.json
#         account-id: "111111111111"
#
# The calling job is responsible for producing plan.json:
#   terraform plan -out=tfplan && terraform show -json tfplan > plan.json

on:
  workflow_call:
    inputs:
      plan-file:
        description: Path to `terraform show -json` output
        required: true
        type: string
      account-id:
        description: AWS account the plan targets
        required: false
        default: ""
        type: string
      account-name:
        description: Friendly name for that account
        required: false
        default: ""
        type: string
      comment-on-pr:
        description: Post the result as a pull request comment
        required: false
        default: true
        type: boolean
      fail-on-new-path:
        description: >-
          Fail the job when the plan opens a new route to AdministratorAccess.
          Set false to report without blocking while a team gets used to it.
        required: false
        default: true
        type: boolean

jobs:
  check:
    name: Check plan for new routes to admin
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out CloudChain
        uses: actions/checkout@v4
        with:
          repository: threetheodrummer/CloudChain
          path: .cloudchain

      - name: Check out the calling repository
        uses: actions/checkout@v4
        with:
          path: workspace

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .cloudchain/backend/requirements.txt

      - name: Install CloudChain
        working-directory: .cloudchain/backend
        run: pip install -r requirements.txt

      - name: Analyse the plan
        id: analyse
        working-directory: .cloudchain/backend
        env:
          CLOUDCHAIN_DB_PATH: ${{ runner.temp }}/cloudchain.db
        run: |
          set +e
          python -m app.cli plan \
            --file "${{ github.workspace }}/workspace/${{ inputs.plan-file }}" \
            --account "${{ inputs.account-id }}" \
            --account-name "${{ inputs.account-name }}" \
            --format markdown > "${{ runner.temp }}/comment.md"
          echo "verdict-code=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat "${{ runner.temp }}/comment.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        if: ${{ inputs.comment-on-pr && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.RUNNER_TEMP + '/comment.md', 'utf8');
            const marker = '<!-- cloudchain-plan-check -->';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            // Update in place rather than adding a comment per push, so the
            // thread stays readable across a long-running pull request.
            const existing = comments.find((c) => c.body.includes(marker));
            const payload = `${marker}\n${body}`;

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: payload,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: payload,
              });
            }

      - name: Fail if the plan opens a new route to admin
        if: ${{ inputs.fail-on-new-path && steps.analyse.outputs.verdict-code != '0' }}
        run: |
          echo "::error::This change introduces a new route to AdministratorAccess."
          exit 1
