name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor CloudChain supports; 3.13 catches deprecations
        # early. Both are tested because pydantic and networkx behave
        # differently across that range.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        # The suite writes SQLite snapshots; point them at a temp path so a
        # runner never inherits state from a previous step.
        env:
          CLOUDCHAIN_DB_PATH: ${{ runner.temp }}/cloudchain-ci.db
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  self-check:
    name: CloudChain scans its own demo org
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      # Proves the whole pipeline runs end to end on a clean machine, not just
      # that the unit tests pass. A scan that only works on the author's laptop
      # is a scan nobody else can reproduce.
      - name: Run a demo scan
        working-directory: backend
        env:
          CLOUDCHAIN_DB_PATH: ${{ runner.temp }}/cloudchain-selfcheck.db
        run: python -m app.cli scan --mode demo

      # The sample plan is known to open a route to admin, so the gate must
      # fail on it. If this step ever passes, the shift-left check has silently
      # stopped working -- which is worse than not having it.
      - name: Terraform plan gate must block a dangerous plan
        working-directory: backend
        env:
          CLOUDCHAIN_DB_PATH: ${{ runner.temp }}/cloudchain-selfcheck.db
        run: |
          if python -m app.cli plan --file tests/fixtures/plan_introduces_path.json \
               --account 111111111111 --account-name prod; then
            echo "::error::plan check exited 0 on a plan that opens a route to admin"
            exit 1
          fi
          echo "Gate correctly blocked the dangerous plan."

      - name: Terraform plan gate must pass a safe plan
        working-directory: backend
        env:
          CLOUDCHAIN_DB_PATH: ${{ runner.temp }}/cloudchain-selfcheck.db
        run: |
          python -m app.cli plan --file tests/fixtures/plan_safe.json \
            --account 111111111111 --account-name prod
